# Copy to config.toml in this directory, or to:
#   Windows: %LOCALAPPDATA%\anki-puppeteer\config.toml
#   macOS/Linux: ~/.config/anki-puppeteer/config.toml

[audio]
# sample_rate = 16000
# device = null          # system default; run --list-devices to see ids

[gate]
# Commands are short. Anything that keeps going is treated as conversation
# and never sent to speech recognition.
# Values match Silero VAD / whisper.cpp command-word defaults:
#   min_speech 250 ms, min_silence 200 ms, speech_pad 300 ms.
# max_burst_seconds = 1.8
# min_burst_seconds = 0.25
# end_silence_seconds = 0.20
# rearm_silence_seconds = 0.50
# speech_pad_seconds = 0.30

[vad]
# Speech probability to start a burst. 0.5 is Silero's default; 0.4 picks up
# quieter/shorter commands. 0.3 is usually too jumpy on a live mic.
# threshold = 0.4

[anki]
url = "http://127.0.0.1:8765"
# key = ""               # only if you set an AnkiConnect API key

# Whole-phrase aliases. The default is the six review words and nothing else.
# [commands]
# show = ["show", "show answer"]
# again = ["again"]
# hard = ["hard"]
# good = ["good"]
# easy = ["easy"]
# undo = ["undo"]
