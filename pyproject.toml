[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anki-puppeteer"
version = "0.9.0"
description = "Anki Puppeteer: review Anki cards by voice while another app is focused."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Daniel G." }]
requires-python = ">=3.10"
keywords = ["anki", "ankiconnect", "vosk", "silero", "speech-recognition", "flashcards"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
]
dependencies = [
    "numpy>=1.24",
    "sounddevice>=0.4.6",
    "vosk>=0.3.45",
    "onnxruntime>=1.16",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.urls]
Homepage = "https://github.com/HeadlessHoncho/anki-puppeteer"
Issues = "https://github.com/HeadlessHoncho/anki-puppeteer/issues"

[project.scripts]
anki-puppeteer = "anki_puppeteer.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
